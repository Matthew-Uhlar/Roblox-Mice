name: Publish to Roblox

# Manual, from the default branch only. Owner setup: docs/publishing/SETUP.md
# (the roblox-production Environment holds the API key). Close the place in Studio first.
on:
  workflow_dispatch:
    inputs:
      smoke_test:
        description: Run the in-Roblox smoke test after publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Only from the default branch (main). The roblox-production Environment
    # holds the ROBLOX_API_KEY secret; the owner can add required reviewers and
    # limit its deployment branches to main (docs/publishing/SETUP.md step 4).
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: roblox-production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The API key is NOT job-level env: only the steps that call Open Cloud get it
    # (products, place, configure, smoke). check.sh and the tool install never see it.
    env:
      ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
      ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
    steps:
      - name: Check configuration
        id: config
        # First step: fails before anything else runs when a secret/variable is missing.
        # It only learns WHETHER the key is set, never its value.
        env:
          HAS_API_KEY: ${{ secrets.ROBLOX_API_KEY != '' }}
        run: |
          missing=0
          [ "$HAS_API_KEY" = "true" ] || { echo "::error title=Missing secret::ROBLOX_API_KEY is not set. Add it to the roblox-production Environment under Settings > Environments (docs/publishing/SETUP.md step 4)."; missing=1; }
          for n in ROBLOX_UNIVERSE_ID ROBLOX_PLACE_ID; do
            v="${!n}"
            if [ -z "$v" ]; then
              echo "::error title=Missing variable::$n is not set. Add it under Settings > Secrets and variables > Actions > Variables (docs/publishing/SETUP.md step 4)."; missing=1
            elif ! [[ "$v" =~ ^[0-9]+$ ]]; then
              echo "::error title=Bad variable::$n must be a number."; missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "Configuration OK (universe $ROBLOX_UNIVERSE_ID, place $ROBLOX_PLACE_ID)"

      - uses: actions/checkout@v5

      - name: Check the smoke test boots like Main.server.luau
        run: python3 scripts/publish.py smoke-sync

      - name: Install tools
        run: |
          ./scripts/install-tools.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Sync game passes and developer products
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 scripts/publish.py products

      - name: scripts/check.sh (with the real product ids)
        run: ./scripts/check.sh

      - name: Publish the place
        id: place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 scripts/publish.py place build/Trunkfall.rbxlx

      - name: Configure place and universe
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 scripts/publish.py configure

      - name: Smoke test in Roblox
        if: ${{ inputs.smoke_test }}
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: python3 scripts/publish.py smoke "${{ steps.place.outputs.version }}"

      - name: Commit product ids
        # Only after every earlier step succeeded. If a later step fails, the next run
        # finds the items it created by name, so no ids are lost and nothing duplicates.
        run: |
          if git diff --quiet -- src/shared/Config/ProductIds.luau; then
            echo "ProductIds.luau unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/Config/ProductIds.luau
          version="${{ steps.place.outputs.version }}"
          git commit -m "Update Roblox product ids${version:+ (published v$version)}"
          for i in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep 5
          done
          echo "::error::Could not push ProductIds.luau"; exit 1
